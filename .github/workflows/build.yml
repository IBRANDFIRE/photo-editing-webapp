
name: Compile Web App to Single HTML

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP files (if present)
        run: |
          find . -maxdepth 2 -name "*.zip" -exec unzip -o {} \;

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Locate index.html and Prepare Project
        run: |
          # Locate index.html anywhere in the project
          INDEX_PATH=$(find . -name "index.html" -not -path "*/.*" -not -path "*/node_modules/*" | head -n 1)

          if [ -z "$INDEX_PATH" ]; then
            echo "Error: index.html not found!"
            exit 1
          fi

          echo "Found index.html at: $INDEX_PATH"
          TARGET_DIR=$(dirname "$INDEX_PATH")
          
          # Move files to root workspace directory if nested
          if [ "$TARGET_DIR" != "." ]; then
            mv "$TARGET_DIR"/* .
          fi

      - name: Install Inlining Tools
        run: npm install -g parcel html-inline

      - name: Bundle Web App into Single HTML
        run: |
          # Remove restrictive CSP headers from HTML source
          sed -i '/content-security-policy/Id' index.html
          sed -i '/Content-Security-Policy/Id' index.html

          # Method 1: Compile using Parcel Single File Bundle
          npx parcel build index.html --no-source-maps --dist-dir build || true

          if [ -f "build/index.html" ]; then
            # Inline built bundle into single file
            html-inline -i build/index.html > bundled_app.html
          else
            # Method 2: Fallback inlining
            html-inline -i index.html > bundled_app.html
          fi

          # Strip remaining CSP headers from final output
          sed -i '/content-security-policy/Id' bundled_app.html

          echo "Bundling finished successfully. File size: $(du -h bundled_app.html | cut -f1)"

      - name: Upload Single HTML Asset
        uses: actions/upload-artifact@v4
        with:
          name: compiled-single-html
          path: bundled_app.html
