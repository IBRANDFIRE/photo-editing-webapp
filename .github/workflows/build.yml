
name: Compile to Single HTML

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP files (if present)
        run: |
          find . -maxdepth 2 -name "*.zip" -exec unzip -o {} \;

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Single-File CLI
        run: npm install -g single-file-cli

      - name: Locate and Bundle HTML
        run: |
          INDEX_PATH=$(find . -name "index.html" -not -path "*/.*" | head -n 1)

          if [ -z "$INDEX_PATH" ]; then
            echo "Error: index.html not found!"
            exit 1
          fi

          echo "Found index.html at: $INDEX_PATH"
          ABS_INDEX_PATH=$(realpath "$INDEX_PATH")

          # Run single-file with dump-content to guarantee file creation
          single-file "file://$ABS_INDEX_PATH" --dump-content --browser-args='["--no-sandbox"]' > bundled_app.html

          # Verify file creation
          if [ -f bundled_app.html ]; then
            echo "Successfully generated bundled_app.html ($(du -h bundled_app.html | cut -f1))"
          else
            echo "Error: bundled_app.html was not created!"
            exit 1
          fi

      - name: Upload Single HTML Asset
        uses: actions/upload-artifact@v4
        with:
          name: compiled-single-html
          path: bundled_app.html

