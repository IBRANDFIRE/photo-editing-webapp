
name: Compile to Single HTML

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP files (if present)
        run: |
          find . -maxdepth 2 -name "*.zip" -exec unzip -o {} \;

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Inliner Tool
        run: npm install -g html-inline

      - name: Locate and Compile HTML
        run: |
          # Find index.html anywhere in the project
          INDEX_PATH=$(find . -name "index.html" -not -path "*/.*" | head -n 1)

          if [ -z "$INDEX_PATH" ]; then
            echo "Error: index.html not found!"
            exit 1
          fi

          echo "Found index.html at: $INDEX_PATH"

          # Get directory containing index.html
          TARGET_DIR=$(dirname "$INDEX_PATH")
          
          # Change directory to process assets correctly
          cd "$TARGET_DIR"

          # Bundle into single HTML file at root level safely
          html-inline -i index.html > "$GITHUB_WORKSPACE/bundled_app.html"

      - name: Upload Single HTML Asset
        uses: actions/upload-artifact@v4
        with:
          name: compiled-single-html
          path: bundled_app.html

