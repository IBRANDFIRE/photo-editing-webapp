name: Compile to Single HTML

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP files (if present)
        run: |
          # Automatically extract any .zip file found in the repository
          find . -maxdepth 2 -name "*.zip" -exec unzip -o {} \;

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Inliner Tool
        run: npm install -g html-inline

      - name: Locate and Compile HTML
        run: |
          # Search for index.html anywhere in the workspace
          INDEX_PATH=$(find . -name "index.html" -not -path "*/.*" | head -n 1)

          if [ -z "$INDEX_PATH" ]; then
            echo "Error: index.html not found!"
            exit 1
          fi

          echo "Found index.html at: $INDEX_PATH"

          # Navigate into the folder containing index.html so relative paths work
          TARGET_DIR=$(dirname "$INDEX_PATH")
          cd "$TARGET_DIR"

          # Bundle into single file
          html-inline -i index.html > bundled_app.html
          
          # Move output file to root workspace root
          mv bundled_app.html $GITHUB_WORKSPACE/bundled_app.html

      - name: Upload Single HTML Asset
        uses: actions/upload-artifact@v4
        with:
          name: compiled-single-html
          path: bundled_app.html

